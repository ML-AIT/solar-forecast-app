name: Deploy API (Azure Container Apps)

# Disabled until Azure is set up: set repository variable DEPLOY_API=true
# plus the variables listed in infra/azure/README.md.
on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure (no stored passwords)
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/solar-api:${{ github.sha }}"
          docker build -t "$IMAGE" apps/api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "${{ vars.CONTAINER_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://$FQDN/health" && exit 0
            sleep 10
          done
          exit 1
