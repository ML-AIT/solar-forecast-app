name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  api-docker:
    name: API (docker build)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t solar-api:ci apps/api

  forecast-job:
    name: Forecast job (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forecast-job
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/forecast-job/uv.lock
      - run: uv sync --locked
      # Lint only, no ruff format: most files are unchanged copies from the ML repo (see its README).
      - run: uv run ruff check .
      - run: uv run pytest -q

  forecast-job-docker:
    name: Forecast job (docker build)
    runs-on: ubuntu-latest
    needs: forecast-job
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t solar-forecast-job:ci apps/forecast-job
      # pvlib is imported inside functions, so import it here to prove the image has it.
      - run: >
          docker run --rm solar-forecast-job:ci python -c
          "import sys; sys.path.insert(0, 'ml/src'); import pvlib, solar.forecast_job"

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
