name: Deploy Web (Azure Storage static website)

# Disabled until Azure is set up: set repository variable DEPLOY_WEB=true,
# plus variables API_BASE_URL (https://<api-fqdn>), STORAGE_ACCOUNT and the Azure login IDs.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure (no stored passwords)
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build static site
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to the storage website
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.STORAGE_ACCOUNT }}" \
            --auth-mode login \
            --destination '$web' \
            --source apps/web/out \
            --overwrite

      - name: Smoke test
        run: |
          WEB_URL=$(az storage account show -n "${{ vars.STORAGE_ACCOUNT }}" \
                    -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query primaryEndpoints.web -o tsv)
          curl -fsS -o /dev/null "$WEB_URL"
