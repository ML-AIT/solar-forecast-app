[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-forecast-api"
version = "0.1.0"
description = "Serves day-ahead 15-min solar PV power forecasts for PEA plants."
readme = "README.md"
requires-python = ">=3.12"
# Upper bounds guard against surprise major-version breaks; uv.lock pins exact versions.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

# Installed by `uv sync` by default; skipped in the Docker image with `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults are idiomatic.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
